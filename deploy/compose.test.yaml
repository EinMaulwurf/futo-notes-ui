# Disposable QA stack: never mounts the live vault.
services:
  sync:
    image: futotech/notes-server:stable
    environment:
      FUTO_NOTES_PASSWORD: browser-test-only-password
      COOKIE_SECURE: "true"
    tmpfs: [/data]
  web:
    image: futo_notes-web:latest
    ports: ["127.0.0.1:13006:8080"]
