# Native clients expect the server's capability document at /.
map $request_method $is_write { default 1; GET 0; HEAD 0; OPTIONS 0; }
map "$is_write:$http_sec_fetch_site" $cross_site_write { default 0; "1:cross-site" 1; }
map $http_accept $browser_home { default 0; ~*text/html 1; }
map "$is_write|$http_origin|$http_host" $cross_origin_write {
    default 1;
    ~^0[|] 0;
    ~^1[|][|] 0;
    "~^1[|]https?://([^/]+)[|]\\1$" 0;
}
server {
    listen 8080;
    server_name _;
    # Preserve the browser origin when TLS terminates at Caddy.
    absolute_redirect off;
    root /usr/share/nginx/html;
    client_max_body_size 100m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    if ($cross_site_write) { return 403; }
    if ($cross_origin_write) { return 403; }
    location = / { if ($browser_home) { return 302 /web/; } proxy_pass http://sync:3000; }
    location = /health { proxy_pass http://sync:3000; }
    location /api/ {
        proxy_pass http://sync:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location = /web { return 308 /web/; }
    location = /web/editor.html {
        include /etc/nginx/editor-csp.conf;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires -1;
        try_files $uri =404;
    }
    location = /web/config.json { add_header Cache-Control "no-store" always; try_files $uri =404; }
    location = /web/sw.js { expires -1; try_files $uri =404; }
    location /web/missing-image/ { return 404; }
    location /web/ { expires -1; try_files $uri $uri/ /web/index.html; }
    location / { return 404; }
}
